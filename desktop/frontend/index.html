<div class="container">

<div class="toast" id="toast"></div>

<script>
    let API_BASE = '';

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? 'rgba(220,38,38,0.9)' : 'rgba(0,0,0,0.8)';
        toast.style.opacity = '1';
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
    }

    function showConfirm(message) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'confirm-overlay';
            overlay.innerHTML = `
                <div class="confirm-box">
                    <p>${message}</p>
                    <div class="confirm-buttons">
                        <button class="confirm-btn">✅ 确定</button>
                        <button class="cancel-btn">❌ 取消</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            const confirmBtn = overlay.querySelector('.confirm-btn');
            const cancelBtn = overlay.querySelector('.cancel-btn');
            const cleanup = () => overlay.remove();
            confirmBtn.onclick = () => { cleanup(); resolve(true); };
            cancelBtn.onclick = () => { cleanup(); resolve(false); };
            overlay.onclick = (e) => { if (e.target === overlay) { cleanup(); resolve(false); } };
        });
    }

    // 复制文本到剪贴板（通用）
    function copyToClipboard(text, successMsg = '已复制到剪贴板') {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ ' + successMsg);
            }).catch(() => {
                // 降级方案
                fallbackCopy(text, successMsg);
            });
        } else {
            fallbackCopy(text, successMsg);
        }
    }

    function fallbackCopy(text, successMsg) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('✅ ' + successMsg);
        } catch (err) {
            showToast('❌ 复制失败', true);
        }
        document.body.removeChild(textarea);
    }

    function showAbout() {
        const overlay = document.createElement('div');
        overlay.className = 'about-overlay';
        overlay.innerHTML = `
            <div class="about-box">
                <h2>📸 拍瞬传</h2>
                <div class="info"><span>版本 v5.0.0</span></div>
                <div class="info"><span>备案号：京ICP备2026034358号</span></div>
                <hr class="divider">
                <div class="info">
                    <span style="font-weight:500;">📦 GitHub：</span>
                    <a class="link" href="https://github.com/shixw/paishunchuan/" target="_blank">https://github.com/shixw/paishunchuan/</a>
                    <button class="copy-link-btn" data-link="https://github.com/shixw/paishunchuan/">复制</button>
                </div>

        if (!API_BASE) return;

            if (Object.keys(groups).length === 0) {

                html += `

                                <div class="image-card">

                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;

            document.querySelectorAll('.group-header').forEach(header => {
                const groupId = header.getAttribute('data-group');
                const grid = document.getElementById(groupId);
                const iconSpan = header.querySelector('.toggle-icon');
                let collapsed = false;
                header.addEventListener('click', function(e) {
                    if (e.target.closest('.group-select-all, .group-select-all-label')) return;
                    collapsed = !collapsed;
                    grid.classList.toggle('collapsed', collapsed);
                    iconSpan.textContent = collapsed ? '▶' : '▼';
                });
            });

            document.querySelectorAll('.group-select-all').forEach(checkbox => {
                checkbox.addEventListener('change', function(e) {
                    e.stopPropagation();
                    const groupId = this.getAttribute('data-group');
                    const grid = document.getElementById(groupId);
                    const imageCheckboxes = grid.querySelectorAll('.image-checkbox');
                    imageCheckboxes.forEach(cb => cb.checked = this.checked);
                });
            });

            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.onclick = (e) => {
                    e.stopPropagation();
                    const url = btn.getAttribute('data-url');
                    if (url) copyImageToClipboard(url);
                };
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.onclick = async (e) => {
                    e.stopPropagation();
                    const url = btn.getAttribute('data-url');
                    if (!url) return;
                    const confirmed = await showConfirm('确定删除这张图片吗？');
                    if (!confirmed) return;
                    const encoded = encodeURIComponent(url);
                    try {
                        const res = await fetch(API_BASE + `/api/image?path=${encoded}`, { method: 'DELETE' });
                        const data = await res.json();
                        if (data.success) refresh();
                        else showToast('删除失败：' + (data.error || '未知错误'), true);
                    } catch (err) { showToast('删除请求失败', true); }
                };
            });
        } catch (err) {
            console.error(err);
            container.innerHTML = '<div class="empty-state">⚠️ 加载失败</div>';
        }
    }

    function setupImagePreview() {
        const container = document.getElementById('imagesContainer');
        if (!container) return;
        container.addEventListener('click', function(e) {
            const img = e.target.closest('.image-card img');
            if (!img) return;
            if (e.target.closest('.image-checkbox, .image-actions, .group-select-all, .group-select-all-label')) return;
            const src = img.getAttribute('src');
            if (!src) return;
            const overlay = document.createElement('div');
            overlay.className = 'image-preview-overlay';
            overlay.innerHTML = `
                <div class="image-preview-close">&times;</div>
                <img src="${src}" alt="预览">
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay || e.target.classList.contains('image-preview-close')) {
                    overlay.remove();
                }
            });
            const escHandler = function(e) {
                if (e.key === 'Escape') {
                    overlay.remove();
                    document.removeEventListener('keydown', escHandler);
                }
            };
            document.addEventListener('keydown', escHandler);
        });
    }

    function setupAutoRefresh() {
        if (window.runtime) {
            window.runtime.EventsOn('imageUploaded', () => refresh());
            window.runtime.EventsOn('clientActive', () => refresh());
            window.runtime.EventsOn('clientInactive', () => refresh());
        } else {
            let retry = 0;
            const timer = setInterval(() => {
                if (window.runtime) {
                    clearInterval(timer);
                    window.runtime.EventsOn('imageUploaded', () => refresh());
                    window.runtime.EventsOn('clientActive', () => refresh());
                    window.runtime.EventsOn('clientInactive', () => refresh());
                } else if (++retry > 20) clearInterval(timer);
            }, 200);
        }
    }

    async function exportPdfWithStyle(paths, style) {
        try {
            const response = await fetch(API_BASE + '/api/pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paths, style })
            });
            if (!response.ok) {
                const text = await response.text();
                showToast('导出失败：' + text, true);
                return;
            }
            const blob = await response.blob();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '拍瞬传-合并.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('✅ PDF已生成并下载');
        } catch (err) {
            console.error(err);
            showToast('导出请求失败', true);
        }
    }

            renderPreview();
        });

        overlay.querySelector('#pdfBorderWidth').addEventListener('input', function() {
            borderWidth = parseInt(this.value) || 1;
            if (borderWidth < 0) borderWidth = 0;
            if (borderWidth > 10) borderWidth = 10;
            this.value = borderWidth;
            renderPreview();
        });

        overlay.querySelector('#pdfCellBackground').addEventListener('input', function() {
            cellBackground = this.value;
            renderPreview();
        });

        overlay.querySelector('#pdfBackground').addEventListener('input', function() {
            background = this.value;
            renderPreview();
        });

        const watermarkCheckbox = overlay.querySelector('#pdfShowWatermark');
        const watermarkInput = overlay.querySelector('#pdfWatermarkText');
        watermarkCheckbox.addEventListener('change', function() {
            showWatermark = this.checked;
            watermarkInput.disabled = !this.checked;
            renderPreview();
        });
        watermarkInput.addEventListener('input', function() {
            watermarkText = this.value;
            renderPreview();
        });

        function getStyleConfig() {
            return {
                pageSize: pageSize,
                orientation: orientation,
                marginTop: marginTop,
                marginBottom: marginBottom,
                marginLeft: marginLeft,
                marginRight: marginRight,
                cols: cols,
                rows: 0,
                gapX: gap,
                gapY: gap,
                alignment: 'center',
                showPageNumber: showPageNumber,
                headerText: showHeader ? headerText : '',
                scaleMode: scaleMode,
                border: border,
                borderColor: borderColor,
                borderWidth: borderWidth,
                cellBackground: cellBackground,
                background: background,
                watermarkText: showWatermark ? watermarkText : ''
            };
        }

        function renderPreview() {
            const style = getStyleConfig();
            const container = overlay.querySelector('#previewCanvasContainer');
            const pageInfo = overlay.querySelector('#previewPageInfo');
            const prevBtn = overlay.querySelector('#previewPrev');
            const nextBtn = overlay.querySelector('#previewNext');

            let pageW = 595.28, pageH = 841.89;
            switch (style.pageSize) {
                case 'A3': pageW = 841.89; pageH = 1190.55; break;
                case 'Letter': pageW = 612; pageH = 792; break;
            }
            if (style.orientation === 'landscape') {
                [pageW, pageH] = [pageH, pageW];
            }

            const pageRows = 4;
            const imagesPerPage = cols * pageRows;
            const totalPages = Math.ceil(paths.length / imagesPerPage);

            if (totalPages < 1) {
                container.innerHTML = '<div class="preview-page" style="padding:20px;color:#94a3b8;">暂无图片</div>';
                return;
            }

            currentPreviewPage = Math.min(currentPreviewPage, totalPages - 1);
            pageInfo.textContent = `第 ${currentPreviewPage + 1} 页 / 共 ${totalPages} 页`;
            prevBtn.disabled = currentPreviewPage === 0;
            nextBtn.disabled = currentPreviewPage === totalPages - 1;

            const scale = Math.min(400 / pageW, 300 / pageH);
            const displayW = pageW * scale;
            const displayH = pageH * scale;

            const marginLeftScaled = marginLeft * scale;
            const marginRightScaled = marginRight * scale;
            const marginTopScaled = marginTop * scale;
            const marginBottomScaled = marginBottom * scale;
            const gapXScaled = gap * scale;
            const gapYScaled = gap * scale;

            const availableW = displayW - marginLeftScaled - marginRightScaled;
            const availableH = displayH - marginTopScaled - marginBottomScaled;

            const cellW = (availableW - (cols - 1) * gapXScaled) / cols;
            const cellH = (availableH - (pageRows - 1) * gapYScaled) / pageRows;

            const startIdx = currentPreviewPage * imagesPerPage;

            let gridHTML = '';
            for (let i = 0; i < imagesPerPage; i++) {
                const imgIdx = startIdx + i;
                const colIdx = i % cols;
                const rowIdx = Math.floor(i / cols);

                const x = marginLeftScaled + colIdx * (cellW + gapXScaled);
                const y = marginTopScaled + rowIdx * (cellH + gapYScaled);

                let cellStyle = `position:absolute;left:${x}px;top:${y}px;width:${cellW}px;height:${cellH}px;`;
                if (style.cellBackground) {
                    cellStyle += `background-color:${style.cellBackground};`;
                }
                if (style.border) {
                    cellStyle += `border:${style.borderWidth}px solid ${style.borderColor};`;
                }

                let cellContent = '';
                if (imgIdx < paths.length) {
                    const imgUrl = API_BASE + '/received_images/' + paths[imgIdx];
                    let imgStyle = 'width:100%;height:100%;';
                    switch (style.scaleMode) {
                        case 'cover': imgStyle += 'object-fit:cover;'; break;
                        case 'stretch': imgStyle += 'object-fit:fill;'; break;
                        default: imgStyle += 'object-fit:contain;';
                    }
                    cellContent = `<img src="${imgUrl}" alt="图片${imgIdx + 1}" loading="lazy" style="${imgStyle}">`;
                } else {
                    cellContent = '<div class="preview-grid-cell-placeholder">空</div>';
                }

                gridHTML += `<div class="preview-grid-cell" style="${cellStyle}">${cellContent}</div>`;
            }

            let headerHTML = '';
            if (style.headerText) {
                headerHTML = `<div class="preview-header-text">${style.headerText}</div>`;
            }

            let pageNumHTML = '';
            if (style.showPageNumber) {
                pageNumHTML = `<div class="preview-page-number">第 ${currentPreviewPage + 1} 页 / 共 ${totalPages} 页</div>`;
            }

            let watermarkHTML = '';
            if (style.watermarkText) {
                const watermarkSize = 14 * scale;
                const stepX = watermarkSize * 5;
                const stepY = watermarkSize * 4.5;
                let watermarkRows = '';
                for (let y = watermarkSize * 2; y < displayH; y += stepY) {
                    for (let x = -stepX / 2; x < displayW; x += stepX) {
                        watermarkRows += `<div style="position:absolute;left:${x}px;top:${y}px;font-size:${watermarkSize}px;color:#f0f0f0;opacity:0.08;transform:rotate(45deg);white-space:nowrap;">${style.watermarkText}</div>`;
                    }
                }
                watermarkHTML = `<div class="preview-watermark" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;">${watermarkRows}</div>`;
            }

            const pageStyle = `width:${displayW}px;height:${displayH}px;${style.background ? 'background-color:' + style.background + ';' : ''}`;

            container.innerHTML = `
                <div class="preview-page-wrapper" style="transform:scale(${zoomLevel});transform-origin:center;">
                    <div class="preview-page" style="${pageStyle}">
                        ${headerHTML}
                        ${gridHTML}
                        ${pageNumHTML}
                        ${watermarkHTML}
                    </div>
                </div>
            `;
        }

        overlay.querySelector('#previewPrev').onclick = () => {
            currentPreviewPage--;
            renderPreview();
        };

        overlay.querySelector('#previewNext').onclick = () => {
            currentPreviewPage++;
            renderPreview();
        };

        overlay.querySelector('#zoomIn').onclick = () => {
            if (zoomLevel < 3) {
                zoomLevel += 0.25;
                overlay.querySelector('#zoomValue').textContent = `${Math.round(zoomLevel * 100)}%`;
                renderPreview();
            }
        };

        overlay.querySelector('#zoomOut').onclick = () => {
            if (zoomLevel > 0.25) {
                zoomLevel -= 0.25;
                overlay.querySelector('#zoomValue').textContent = `${Math.round(zoomLevel * 100)}%`;
                renderPreview();
            }
        };

        overlay.querySelector('#pdfStyleClose').onclick = () => overlay.remove();
        overlay.querySelector('#btnCancel').onclick = () => overlay.remove();
        overlay.querySelector('#btnPreview').onclick = renderPreview;
        overlay.querySelector('#btnExport').onclick = () => {
            const style = getStyleConfig();
            overlay.remove();
            exportPdfWithStyle(paths, style);
        };

        overlay.onclick = (e) => {
            if (e.target === overlay) overlay.remove();
        };

        setTimeout(renderPreview, 100);
    }

    initAPI();
</script>
</body>
</html>
