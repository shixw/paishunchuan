name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: ./desktop
        run: |
          wails build -platform windows/amd64 -ldflags "-s -w"
          mkdir -p ../dist
          Copy-Item -Path "build/bin/拍瞬传.exe" -Destination "../dist/拍瞬传-windows-amd64.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 拍瞬传-windows-amd64
          path: dist/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: ./desktop
        run: |
          wails build -platform darwin/${{ matrix.arch }} -ldflags "-s -w"
          mkdir -p ../dist
          # 将 .app 压缩为 zip，便于上传和下载
          zip -r "../dist/拍瞬传-darwin-${{ matrix.arch }}.zip" "build/bin/拍瞬传.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 拍瞬传-darwin-${{ matrix.arch }}
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: ./desktop
        run: |
          wails build -platform linux/amd64 -ldflags "-s -w"
          mkdir -p ../dist
          cp "build/bin/拍瞬传" "../dist/拍瞬传-linux-amd64"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 拍瞬传-linux-amd64
          path: dist/*

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*