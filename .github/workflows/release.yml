name: Build and Release

on:
  push:
    tags:
      - 'v*'   # 匹配 v1.0.0, v2.1.3 等

jobs:
  build:
    name: Build Go binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          # macOS 上 arm64 是 Apple Silicon，amd64 是 Intel，两者都保留
          # 排除 windows/arm64（可选）
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build server binary
        working-directory: ./server
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o psc-server-${{ matrix.goos }}-${{ matrix.goarch }} main.go
          # Windows 可执行文件需要 .exe 后缀
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv psc-server-${{ matrix.goos }}-${{ matrix.goarch }} psc-server-${{ matrix.goos }}-${{ matrix.goarch }}.exe
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psc-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: server/psc-server-*

  release:
    name: Create Release and Upload Assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须，用于创建 release 和上传文件
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts (debug)
        run: ls -R artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*

      - name: Upload Release Assets (explicit)
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*