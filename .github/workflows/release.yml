name: Build and Release

on:
  push:
    tags:
      - 'v*'           # 推送 v1.0.0、v2.1.3 等标签时触发

jobs:
  build:
    name: Build Wails Desktop App
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows/amd64, darwin/amd64, darwin/arm64, linux/amd64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build for ${{ matrix.platform }}
        run: |
          wails build -platform ${{ matrix.platform }} -ldflags "-s -w"
          mkdir -p dist
          if [[ "${{ matrix.platform }}" == windows/* ]]; then
            cp build/bin/paishunchuan-desktop.exe dist/paishunchuan-desktop-${{ matrix.platform }}.exe
          elif [[ "${{ matrix.platform }}" == darwin/* ]]; then
            cp -r build/bin/paishunchuan-desktop.app dist/paishunchuan-desktop-${{ matrix.platform }}.app
          else
            cp build/bin/paishunchuan-desktop dist/paishunchuan-desktop-${{ matrix.platform }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paishunchuan-${{ matrix.platform }}
          path: dist/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*