name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: ./desktop
        run: |
          wails build -platform windows/amd64 -ldflags "-s -w" -webview2 embed
          mkdir -p ../dist
          Copy-Item -Path "build/bin/paishunchuan-desktop.exe" -Destination "../dist/paishunchuan-${{ github.ref_name }}-win-amd64.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paishunchuan-win-amd64
          path: dist/*

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        working-directory: ./desktop
        run: |
          wails build -platform darwin/${{ matrix.arch }} -ldflags "-s -w"
          mkdir -p ../dist
          # 生成 ZIP
          zip -r "../dist/paishunchuan-${{ github.ref_name }}-mac-${{ matrix.arch }}.zip" "build/bin/拍瞬传.app"
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Create DMG
        working-directory: ./desktop
        run: |
          create-dmg --volname "拍瞬传" \
                     --window-pos 200 120 \
                     --window-size 800 400 \
                     --icon-size 100 \
                     --icon "拍瞬传.app" 200 190 \
                     --hide-extension "拍瞬传.app" \
                     --app-drop-link 600 185 \
                     "../dist/paishunchuan-${{ github.ref_name }}-mac-${{ matrix.arch }}.dmg" \
                     "build/bin/拍瞬传.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paishunchuan-mac-${{ matrix.arch }}
          path: dist/*

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*